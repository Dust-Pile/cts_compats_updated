plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.14.476" apply false
}

architectury {
    minecraft = minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${rootProject.minecraft_version}:${rootProject.parchment_version}@zip")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    version = rootProject.mod_version
    group = rootProject.mod_group_id

    repositories {
        mavenCentral()
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = "https://maven.architectury.dev" }
        maven { url = "https://maven.fabricmc.net" }
        maven { url = "https://maven.minecraftforge.net" }
        maven { url = "https://registry.somethingcatchy.net/repository/maven-releases/" }
        maven { url = "https://api.modrinth.com/maven" }
        maven {
            url = "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        maven { url = "https://repo.spongepowered.org/repository/maven-public" }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(17)
        withSourcesJar()
    }
}

tasks.named("build") {
    dependsOn(":common:build", ":forge:build", ":fabric:build")
}

tasks.register("runClient") {
    doLast {
        throw new GradleException("Use :fabric:runClient or :forge:runClient")
    }
}
