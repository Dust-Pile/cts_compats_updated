import org.gradle.api.tasks.PathSensitivity
import groovy.json.JsonSlurper

plugins {
    id "com.gradleup.shadow" version "9.3.1"
}

@CacheableTransform
abstract class ExtractFabricNestedJars implements TransformAction<TransformParameters.None> {
    @PathSensitive(PathSensitivity.NAME_ONLY)
    @InputArtifact
    abstract Provider<FileSystemLocation> getInputArtifact()

    @Override
    void transform(TransformOutputs outputs) {
        new java.util.zip.ZipFile(inputArtifact.get().asFile).withCloseable { modJar ->
            def metadataEntry = modJar.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Fabric mod is missing fabric.mod.json")
            }

            def metadata = modJar.getInputStream(metadataEntry).withCloseable { input ->
                new JsonSlurper().parse(input)
            }
            metadata.jars.each { nestedJar ->
                def entry = modJar.getEntry(nestedJar.file)
                if (entry == null) {
                    throw new GradleException("Fabric mod is missing embedded artifact ${nestedJar.file}")
                }

                modJar.getInputStream(entry).withCloseable { input ->
                    outputs.file(entry.name.substring(entry.name.lastIndexOf('/') + 1)).withOutputStream { output ->
                        output << input
                    }
                }
            }
        }
    }
}

